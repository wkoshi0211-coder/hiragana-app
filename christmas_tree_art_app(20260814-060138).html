<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>みんなのクリスマスツリー</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
body{
  background:
    radial-gradient(circle at 20% 18%,rgba(255,255,255,.9) 0 2px,transparent 3px),
    radial-gradient(circle at 72% 12%,rgba(255,255,255,.8) 0 2px,transparent 3px),
    radial-gradient(circle at 90% 35%,rgba(255,255,255,.7) 0 2px,transparent 3px),
    radial-gradient(circle at 42% 28%,rgba(255,255,255,.65) 0 1.5px,transparent 2px),
    linear-gradient(#07172b 0%,#0b2942 58%,#18313d 100%);
}
.app{height:100dvh;position:relative;overflow:hidden}
.scene{position:absolute;inset:0;overflow:hidden}
.scene:before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(circle at 15% 48%,rgba(255,255,255,.5) 0 1px,transparent 2px),
    radial-gradient(circle at 83% 22%,rgba(255,255,255,.55) 0 1px,transparent 2px),
    radial-gradient(circle at 30% 8%,rgba(255,255,255,.55) 0 1px,transparent 2px),
    radial-gradient(circle at 63% 38%,rgba(255,255,255,.45) 0 1px,transparent 2px);
}

/* 上部は極力シンプルに */
.topbar{
  position:absolute;top:0;left:0;right:0;height:70px;
  display:flex;align-items:center;justify-content:center;
  z-index:30;pointer-events:none;
}
.title{
  background:rgba(255,255,255,.92);color:#24523a;
  padding:9px 22px;border-radius:999px;
  font-size:22px;font-weight:900;
  box-shadow:0 4px 16px rgba(0,0,0,.18);
}

.tree{
  position:absolute;left:50%;top:49%;transform:translate(-50%,-50%);
  width:min(48vw,470px);height:min(78vh,650px);z-index:4;
}
.layer{position:absolute;left:50%;transform:translateX(-50%);border-left:solid transparent;border-right:solid transparent}
.l1{top:9%;border-left-width:150px;border-right-width:150px;border-bottom:250px solid #1a7339}
.l2{top:29%;border-left-width:190px;border-right-width:190px;border-bottom:300px solid #145f31}
.l3{top:50%;border-left-width:225px;border-right-width:225px;border-bottom:340px solid #10512c}
.trunk{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:70px;height:100px;background:#6d3f20;border-radius:5px}
.star{
  position:absolute;top:0;left:50%;transform:translateX(-50%);
  font-size:78px;z-index:7;
  filter:drop-shadow(0 0 15px #ffe66b);
  animation:pulse 1.8s infinite;
}
@keyframes pulse{
  50%{transform:translateX(-50%) scale(1.08);filter:drop-shadow(0 0 25px #fff19a)}
}
.garland{
  position:absolute;height:30px;border-bottom:7px solid #e8c34c;border-radius:50%;
  z-index:7;filter:drop-shadow(0 0 5px rgba(255,224,91,.8))
}
.g1{width:290px;top:43%;left:50%;transform:translateX(-50%)}
.g2{width:345px;top:60%;left:50%;transform:translateX(-50%)}
.g3{width:395px;top:76%;left:50%;transform:translateX(-50%)}
.bulb{
  position:absolute;width:12px;height:12px;border-radius:50%;
  background:#ffe66a;box-shadow:0 0 13px 4px #ffe66a;z-index:8
}
.b1{left:41%;top:36%}.b2{left:60%;top:44%}.b3{left:34%;top:54%}
.b4{left:68%;top:61%}.b5{left:48%;top:70%}.b6{left:27%;top:69%}.b7{left:73%;top:76%}

.floor{
  position:absolute;left:0;right:0;bottom:0;height:18%;
  background:linear-gradient(#29414a,#14262f);z-index:1
}

/* 作品 */
.art{
  position:absolute;width:88px;height:88px;object-fit:contain;
  z-index:12;cursor:pointer;
  filter:drop-shadow(0 5px 4px rgba(0,0,0,.3));
  transition:transform .2s;
}
@keyframes sway{
  0%,100%{margin-top:0; transform:rotate(var(--base-rotate)) translateX(0)}
  25%{margin-top:-3px; transform:rotate(calc(var(--base-rotate) + 3deg)) translateX(3px)}
  50%{margin-top:0; transform:rotate(calc(var(--base-rotate) - 3deg)) translateX(-2px)}
  75%{margin-top:3px; transform:rotate(calc(var(--base-rotate) + 2deg)) translateX(2px)}
}
.art.swaying{
  animation:sway 3.2s ease-in-out infinite;
  transform-origin:50% 80%;
}
.art.active{animation:pop .8s ease both}
@keyframes tapSway{
  0%,100%{transform:rotate(var(--base-rotate))}
  25%{transform:rotate(calc(var(--base-rotate) - 6deg))}
  50%{transform:rotate(calc(var(--base-rotate) + 6deg))}
  75%{transform:rotate(calc(var(--base-rotate) - 4deg))}
}
.art.tap-sway{
  animation:tapSway 2.2s ease-in-out infinite;
}
@keyframes pop{
  0%{filter:drop-shadow(0 5px 4px rgba(0,0,0,.3))}
  35%{filter:drop-shadow(0 0 18px #ffe36b) drop-shadow(0 5px 4px rgba(0,0,0,.3))}
  70%{filter:drop-shadow(0 0 10px #fff3a0) drop-shadow(0 5px 4px rgba(0,0,0,.3))}
  100%{filter:drop-shadow(0 5px 4px rgba(0,0,0,.3))}
}

/* 画面上の操作ボタンは小さく */
.deleteAll{
  position:absolute;right:18px;top:16px;z-index:40;
  border:0;border-radius:999px;padding:13px 18px;
  background:#d94b4b;color:white;font-size:15px;font-weight:900;
  box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer
}
.upload{
  position:absolute;left:18px;bottom:18px;z-index:40;
  border:0;border-radius:999px;padding:13px 20px;
  background:#29994c;color:white;font-size:17px;font-weight:900;
  box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer;
}
.count{
  position:absolute;right:18px;bottom:18px;z-index:40;
  background:rgba(255,255,255,.92);color:#23523a;
  border-radius:999px;padding:11px 17px;font-weight:900;
  box-shadow:0 4px 14px rgba(0,0,0,.2);
}
.hint{
  position:absolute;left:50%;bottom:18px;transform:translateX(-50%);
  z-index:20;background:rgba(255,250,228,.94);color:#24445a;
  border-radius:999px;padding:9px 22px;font-weight:900;
  box-shadow:0 4px 14px rgba(0,0,0,.18);
  white-space:nowrap;font-size:15px;
}
.spark{position:absolute;z-index:25;pointer-events:none;font-size:28px;animation:fly 1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--x),var(--y)) scale(.3);opacity:0}}

#fileInput{display:none}
.processing{
  position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.62);
  display:none;align-items:center;justify-content:center;color:#fff;
  font-size:20px;font-weight:900
}
.processing.show{display:flex}
.processingCard{
  background:rgba(20,45,65,.95);border-radius:20px;padding:22px 30px;
  text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.35)
}
.spinner{
  width:38px;height:38px;border:4px solid rgba(255,255,255,.35);
  border-top-color:#fff;border-radius:50%;margin:0 auto 12px;
  animation:spin .8s linear infinite
}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{
  position:fixed;left:50%;top:80px;transform:translateX(-50%) translateY(-15px);
  z-index:120;background:#fff2ad;color:#4b3b13;
  border-radius:999px;padding:11px 20px;font-weight:900;
  opacity:0;pointer-events:none;transition:.25s;
  box-shadow:0 4px 18px rgba(0,0,0,.25)
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:650px){
  .title{font-size:17px;padding:8px 16px}
  .topbar{height:58px}
  .tree{width:78vw;height:76vh}
  .l1{border-left-width:110px;border-right-width:110px;border-bottom-width:190px}
  .l2{border-left-width:140px;border-right-width:140px;border-bottom-width:225px}
  .l3{border-left-width:165px;border-right-width:165px;border-bottom-width:255px}
  .g1{width:220px}.g2{width:255px}.g3{width:290px}
  .art{width:68px;height:68px}
  .upload{font-size:15px;padding:11px 16px}
  .deleteAll{font-size:13px;padding:10px 13px}
  .hint{font-size:12px;bottom:19px;padding:8px 14px}
  .count{font-size:13px;padding:9px 13px}
}
</style>
</head>
<body>
<div class="app">
  <div class="scene" id="scene">
    <div class="topbar"><div class="title">🎄 みんなのクリスマスツリー</div></div>

    <div class="tree">
      <div class="star">⭐</div>
      <div class="layer l1"></div>
      <div class="layer l2"></div>
      <div class="layer l3"></div>
      <div class="garland g1"></div>
      <div class="garland g2"></div>
      <div class="garland g3"></div>
      <div class="bulb b1"></div><div class="bulb b2"></div><div class="bulb b3"></div>
      <div class="bulb b4"></div><div class="bulb b5"></div><div class="bulb b6"></div><div class="bulb b7"></div>
      <div class="trunk"></div>
    </div>

    <div class="floor"></div>

    <button class="upload" id="uploadBtn">📤 作品をアップロード</button>
    <button class="deleteAll" id="deleteAllBtn">🗑 作品を全部削除</button>
    <div class="hint">作品をタップしてみよう ✨</div>
    <div class="count" id="count">0 作品</div>
  </div>
</div>

<input id="fileInput" type="file" accept="image/*" multiple>
<div class="processing" id="processing">
  <div class="processingCard"><div class="spinner"></div>作品を切り抜いています…</div>
</div>
<div class="toast" id="toast"></div>

<script>
const KEY='christmasTreeWorks_simple_v2';
let works=[];

const scene=document.getElementById('scene');
const fileInput=document.getElementById('fileInput');
const count=document.getElementById('count');
const toast=document.getElementById('toast');

const positions=[
 [27,18,-8],[45,16,7],[62,19,-5],
 [17,35,8],[38,34,-6],[57,34,5],[76,34,-7],
 [23,50,-4],[47,48,6],[68,50,-8],
 [13,65,7],[35,63,-6],[57,65,7],[79,62,-5],
 [24,76,5],[47,76,-7],[68,76,5],
 [35,84,-5],[57,84,7],[82,78,-8]
];

document.getElementById('uploadBtn').addEventListener('click',()=>{
  fileInput.click();
});
function clearAllWorks(){
  // 「作品を全部削除」を押したら、確認なしで全作品を削除
  works = [];

  // 保存されているアップロード画像データを削除
  try{
    localStorage.removeItem(KEY);
  }catch(e){
    console.error(e);
  }

  // 画面上のアップロード画像をすべて削除
  scene.querySelectorAll('img.art').forEach(img => img.remove());

  // 残っているアニメーションも削除
  scene.querySelectorAll('.spark').forEach(el => el.remove());

  // 作品数を0にする
  count.textContent = '0 作品';

  showToast('アップロードした作品をすべて削除しました');
}

document.getElementById('deleteAllBtn').onclick = clearAllWorks;

fileInput.addEventListener('change',async e=>{
  const files=[...e.target.files].filter(f=>f.type.startsWith('image/'));
  if(!files.length)return;

  const processing=document.getElementById('processing');
  if(processing)processing.classList.add('show');

  try{
    for(const file of files){
      const cutout=await removeBackground(file);
      works.push({
        id:Date.now().toString(36)+Math.random().toString(36).slice(2),
        src:cutout,
        sound:Math.floor(Math.random()*6),
        created:new Date().toLocaleString('ja-JP',{
          month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'
        })
      });
    }

    save();
    render();
    showToast(files.length+'つの作品がツリーに登場！ 🎄');
  }catch(err){
    console.error(err);
    showToast('画像の読み込みに失敗しました');
  }finally{
    if(processing)processing.classList.remove('show');
    fileInput.value='';
  }
});

/* 写真の外側につながっている紙の背景だけを透明化 */
function removeBackground(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onerror=reject;

    reader.onload=()=>{
      const img=new Image();
      img.onerror=reject;

      img.onload=()=>{
        const max=1200;
        const scale=Math.min(1,max/img.width,max/img.height);
        const w=Math.max(1,Math.round(img.width*scale));
        const h=Math.max(1,Math.round(img.height*scale));

        const c=document.createElement('canvas');
        c.width=w;
        c.height=h;

        const ctx=c.getContext('2d',{willReadFrequently:true});
        ctx.drawImage(img,0,0,w,h);

        const image=ctx.getImageData(0,0,w,h);
        const d=image.data;

        const samplePoints=[
          [0,0],[w-1,0],[0,h-1],[w-1,h-1],
          [Math.floor(w*.02),Math.floor(h*.02)],
          [Math.floor(w*.98),Math.floor(h*.02)],
          [Math.floor(w*.02),Math.floor(h*.98)],
          [Math.floor(w*.98),Math.floor(h*.98)]
        ];

        let br=0,bg=0,bb=0;
        for(const [x,y] of samplePoints){
          const p=(y*w+x)*4;
          br+=d[p]; bg+=d[p+1]; bb+=d[p+2];
        }
        br/=samplePoints.length;
        bg/=samplePoints.length;
        bb/=samplePoints.length;

        const colorDistance=(idx)=>{
          const dr=d[idx]-br;
          const dg=d[idx+1]-bg;
          const db=d[idx+2]-bb;
          return Math.sqrt(dr*dr+dg*dg+db*db);
        };

        const looksLikePaper=(idx)=>{
          const r=d[idx],g=d[idx+1],b=d[idx+2];
          const brightness=(r+g+b)/3;
          const saturation=Math.max(r,g,b)-Math.min(r,g,b);
          const dist=colorDistance(idx);

          return dist<58 ||
                 (brightness>190 && saturation<55 && dist<90);
        };

        const visited=new Uint8Array(w*h);
        const queue=new Int32Array(w*h);
        let head=0,tail=0;

        const push=(x,y)=>{
          if(x<0||x>=w||y<0||y>=h)return;
          const p=y*w+x;
          if(visited[p])return;
          visited[p]=1;

          if(looksLikePaper(p*4)){
            queue[tail++]=p;
          }
        };

        for(let x=0;x<w;x++){
          push(x,0);
          push(x,h-1);
        }
        for(let y=1;y<h-1;y++){
          push(0,y);
          push(w-1,y);
        }

        while(head<tail){
          const p=queue[head++];
          const x=p%w;
          const y=Math.floor(p/w);
          push(x+1,y);
          push(x-1,y);
          push(x,y+1);
          push(x,y-1);
        }

        for(let i=0;i<tail;i++){
          d[queue[i]*4+3]=0;
        }

        const transparent=new Uint8Array(w*h);
        for(let i=0;i<tail;i++)transparent[queue[i]]=1;

        for(let i=0;i<tail;i++){
          const p=queue[i];
          const x=p%w;
          const y=Math.floor(p/w);
          const neighbors=[p-1,p+1,p-w,p+w];

          for(const np of neighbors){
            if(np<0||np>=w*h||transparent[np])continue;
            const idx=np*4;
            if(colorDistance(idx)<28){
              d[idx+3]=Math.min(d[idx+3],90);
            }
          }
        }

        ctx.putImageData(image,0,0);
        resolve(c.toDataURL('image/png'));
      };

      img.src=reader.result;
    };

    reader.readAsDataURL(file);
  });
}

function save(){
  try{
    localStorage.setItem(KEY,JSON.stringify(works));
  }catch(e){
    console.error(e);
    showToast('作品を保存できませんでした');
  }
}

function load(){
  try{
    works=JSON.parse(localStorage.getItem(KEY)||'[]')||[];
  }catch(e){
    works=[];
  }
}

function render(){
  document.querySelectorAll('.art,.spark').forEach(el=>el.remove());

  works.forEach((w,i)=>{
    const img=document.createElement('img');
    img.src=w.src;
    img.className='art';
    img.dataset.id=w.id;
    img.alt='アップロードした作品';

    const p=positions[i%positions.length];
    img.style.left=p[0]+'%';
    img.style.top=p[1]+'%';
    img.style.setProperty('--base-rotate',p[2]+'deg');
    img.classList.add('swaying');

    img.addEventListener('click',()=>animate(img,w));
    scene.appendChild(img);
  });

  count.textContent=works.length+' 作品';
}

let audioContext=null;



function playChristmasSound(soundType=0){
  try{
    if(!audioContext){
      audioContext=new (window.AudioContext||window.webkitAudioContext)();
    }
    if(audioContext.state==='suspended') audioContext.resume();

    const now=audioContext.currentTime;

    // 約2秒のクリスマスらしいベル音。
    // 作品ごとに少し違う音程のベルを鳴らします。
    const patterns=[
      [659.25,783.99,987.77,1046.50],
      [783.99,987.77,1174.66,1567.98],
      [523.25,659.25,783.99,1046.50],
      [587.33,739.99,880.00,1174.66],
      [659.25,830.61,987.77,1318.51],
      [392.00,523.25,659.25,783.99]
    ];

    const notes=patterns[soundType%patterns.length];

    notes.forEach((freq,i)=>{
      const t=now+i*.22;

      const osc=audioContext.createOscillator();
      const gain=audioContext.createGain();

      osc.type='sine';
      osc.frequency.setValueAtTime(freq,t);

      gain.gain.setValueAtTime(0,t);
      gain.gain.linearRampToValueAtTime(.16,t+.012);
      gain.gain.exponentialRampToValueAtTime(.001,t+.75);

      osc.connect(gain);
      gain.connect(audioContext.destination);

      osc.start(t);
      osc.stop(t+.8);
    });

    // ベルの高い余韻
    const last=now+.72;
    [1318.51,1567.98,1975.53].forEach((freq,j)=>{
      const t=last+j*.14;
      const osc=audioContext.createOscillator();
      const gain=audioContext.createGain();

      osc.type='sine';
      osc.frequency.setValueAtTime(freq,t);

      gain.gain.setValueAtTime(.08,t);
      gain.gain.exponentialRampToValueAtTime(.001,t+.9);

      osc.connect(gain);
      gain.connect(audioContext.destination);

      osc.start(t);
      osc.stop(t+1);
    });

  }catch(e){
    console.log('ベルを再生できませんでした',e);
  }
}

function animate(el,w){
  // タップした瞬間にベルを鳴らし、その画像だけ左右に揺らす
  playChristmasSound(w.sound ?? 0);

  el.classList.remove('active','tap-sway');
  void el.offsetWidth;
  el.classList.add('active','tap-sway');



  for(let i=0;i<8;i++){
    const s=document.createElement('div');
    s.className='spark';
    s.textContent=['✨','⭐','🎵','❄️'][i%4];
    s.style.left=(el.offsetLeft+el.offsetWidth/2)+'px';
    s.style.top=(el.offsetTop+el.offsetHeight/2)+'px';
    s.style.setProperty('--x',((Math.random()*180)-90)+'px');
    s.style.setProperty('--y',((-40-Math.random()*140))+'px');

    scene.appendChild(s);
    setTimeout(()=>s.remove(),1050);
  }
}

function showToast(t){
  toast.textContent=t;
  toast.classList.add('show');
  clearTimeout(showToast.timer);
  showToast.timer=setTimeout(()=>{
    toast.classList.remove('show');
  },2200);
}

load();
render();
</script>
</body>
</html>
