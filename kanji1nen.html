<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>小学1年生 漢字練習</title>

<style>

body{
    margin:0;
    font-family:sans-serif;
    background:#f5f5f5;
    touch-action:none;
}

.topbar{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    padding:10px;
    background:white;
    border-bottom:1px solid #ccc;
    position:sticky;
    top:0;
    z-index:100;
}

button{
    font-size:18px;
    padding:10px 16px;
    border:none;
    border-radius:10px;
    background:#1976d2;
    color:white;
}

.screen{
    padding:10px;
}

.hidden{
    display:none;
}

.title{
    text-align:center;
    font-size:32px;
    margin:20px 0;
}

.kanji-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(60px,1fr));
    gap:10px;
    max-width:900px;
    margin:auto;
}

.kanji-btn{
    height:60px;
    font-size:32px;
    background:white;
    border:2px solid #4aa3df;
    border-radius:12px;
    color:black;

    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
}

.kanji-btn.done{
    background:#e53935;
    color:white;
}

.sheet{
    background:white;
    border-radius:20px;
    padding:20px;
    padding-bottom:60px;
    max-width:900px;
    margin:auto;
}

.row{
    display:flex;
    flex-wrap:wrap;
    gap:20px;
}

.model{
    width:180px;
    text-align:center;
}

.big-kanji{
    font-size:120px;
    color:#cccccc;
    border:2px solid #4aa3df;
    height:180px;
    display:flex;
    justify-content:center;
    align-items:center;
    background:white;
}

.reading{
    font-size:28px;
    margin-top:10px;
}

.illustration{
    font-size:80px;
    margin-top:10px;
}

.practice-area{
    flex:1;
    min-width:300px;
}

.canvas-wrap{
    position:relative;

    aspect-ratio:1/1;

    width:min(70vw, 65vh);

    max-width:700px;

    border:2px solid #4aa3df;
    background:white;
}

canvas{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    touch-action:none;
}

.message{
    text-align:center;
    font-size:28px;
    color:red;
    margin-top:10px;
}

</style>
</head>

<body>

<!-- 一覧画面 -->

<div id="listScreen" class="screen">

    <div class="title">
        小学1年生の漢字80字
    </div>

    <div class="kanji-grid" id="kanjiGrid"></div>

</div>

<!-- 練習画面 -->

<div id="practiceScreen" class="screen hidden">

    <div class="topbar">

        <button id="backBtn">一覧へ</button>
        <button id="penBtn">黒ペン</button>
        <button id="eraserBtn">消しゴム</button>
        <button id="doneBtn">できました</button>
        <button id="clearBtn">全部消す</button>

    </div>

    <div class="sheet">

        <div class="title" id="titleKanji">
            石
        </div>

        <div class="row">

            <div class="model">

                <div class="big-kanji" id="modelKanji">
                    石
                </div>

                <div class="reading" id="reading">
                    いし
                </div>

                <div id="illustration" class="illustration">
                    🪨
                </div>

            </div>

            <div class="practice-area">

                <div class="canvas-wrap">

                    <canvas id="gridCanvas"></canvas>
                    <canvas id="drawCanvas"></canvas>

                </div>

                <div class="message" id="message"></div>

            </div>

        </div>

    </div>

</div>

<script>

const kanjiList = [
"一","右","雨","円","王","音","下","火","花","貝",
"学","気","九","休","玉","金","空","月","犬","見",
"五","口","校","左","三","山","子","四","糸","字",
"耳","七","車","手","十","出","女","小","上","森",
"人","水","正","生","青","夕","石","赤","千","川",
"先","早","草","足","村","大","男","竹","中","虫",
"町","天","田","土","二","日","入","年","白","八",
"百","文","木","本","名","目","立","力","林","六"
];

const readings = {

};

const illustrations = {

"一":"1️⃣",
"右":"➡️",

"王":"👑",

"金":"💰",
"空":"☁️",

"犬":"🐶",
"見":"👀",

"五":"5️⃣",
"口":"👄",
"校":"🏫",
"左":"⬅️",
"三":"3️⃣",
"山":"⛰️",
"子":"👦",
"四":"4️⃣",

"耳":"👂",

"男":"👦",
"竹":"🎍",
"中":"⭕",
"虫":"🐞",

"町":"🏘️",
"天":"☀️",
"田":"🌾",
"土":"🟫",
"二":"2️⃣",
"日":"☀️",
"入":"🚪",
"年":"📅",
"白":"⚪",
"八":"8️⃣",

"百":"💯",
"文":"📄",
"木":"🌲",
"本":"📘",
"名":"🏷️",
"目":"👁️",
"立":"🧍",
"力":"💪",
"林":"🌲",
"六":"6️⃣"

};

const kanjiGrid = document.getElementById("kanjiGrid");

let completedKanji = {};

kanjiList.forEach(kanji=>{

    const btn = document.createElement("button");

    btn.className = "kanji-btn";
    btn.innerText = kanji;

    // 通常タップ
    btn.onclick = ()=>{

        openPractice(kanji);
    };

    // 長押し
    let pressTimer;

    const startPress = ()=>{

        pressTimer = setTimeout(()=>{

            completedKanji[kanji] =
            !completedKanji[kanji];

            if(completedKanji[kanji]){

                btn.classList.add("done");

            }else{

                btn.classList.remove("done");
            }

        },600);
    };

    const cancelPress = ()=>{

        clearTimeout(pressTimer);
    };

    btn.addEventListener("touchstart",startPress);
    btn.addEventListener("touchend",cancelPress);
    btn.addEventListener("touchmove",cancelPress);

    btn.addEventListener("mousedown",startPress);
    btn.addEventListener("mouseup",cancelPress);
    btn.addEventListener("mouseleave",cancelPress);

    kanjiGrid.appendChild(btn);
});

const listScreen = document.getElementById("listScreen");
const practiceScreen = document.getElementById("practiceScreen");

const modelKanji = document.getElementById("modelKanji");
const titleKanji = document.getElementById("titleKanji");
const reading = document.getElementById("reading");
const illustration = document.getElementById("illustration");

const gridCanvas = document.getElementById("gridCanvas");
const drawCanvas = document.getElementById("drawCanvas");

const gridCtx = gridCanvas.getContext("2d");
const drawCtx = drawCanvas.getContext("2d");

let currentKanji = "石";

let drawing = false;
let eraserMode = false;
let teacherMode = false;

let savedDrawings = {};

function openPractice(kanji){

    if(currentKanji){

        savedDrawings[currentKanji] =
        drawCanvas.toDataURL();
    }

    teacherMode = false;
    eraserMode = false;

    currentKanji = kanji;

    modelKanji.innerText = kanji;
    titleKanji.innerText = kanji;

    reading.innerText = readings[kanji] || "";

    illustration.innerText =
    illustrations[kanji] || "😀";

    document.getElementById("message").innerText = "";

    listScreen.classList.add("hidden");
    practiceScreen.classList.remove("hidden");

    resizeCanvas();

    drawCtx.clearRect(
        0,
        0,
        drawCanvas.width,
        drawCanvas.height
    );

    if(savedDrawings[kanji]){

        const img = new Image();

        img.onload = ()=>{

            drawCtx.drawImage(
                img,
                0,
                0,
                drawCanvas.width /
                (window.devicePixelRatio || 1),
                drawCanvas.height /
                (window.devicePixelRatio || 1)
            );
        };

        img.src = savedDrawings[kanji];
    }
}

document.getElementById("backBtn").onclick = ()=>{

    savedDrawings[currentKanji] =
    drawCanvas.toDataURL();

    practiceScreen.classList.add("hidden");
    listScreen.classList.remove("hidden");
};

function resizeCanvas(){

    const rect = drawCanvas.parentElement.getBoundingClientRect();

    const dpr = window.devicePixelRatio || 1;

    [gridCanvas, drawCanvas].forEach(canvas=>{

        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;

        canvas.style.width = rect.width + "px";
        canvas.style.height = rect.height + "px";
    });

    gridCtx.setTransform(1,0,0,1,0,0);
    drawCtx.setTransform(1,0,0,1,0,0);

    gridCtx.scale(dpr,dpr);
    drawCtx.scale(dpr,dpr);

    drawGrid(rect.width, rect.height);
}

function drawGrid(width,height){

    gridCtx.clearRect(0,0,width,height);

    const cols = 4;
    const rows = 4;

    const w = width / cols;
    const h = height / rows;

    gridCtx.strokeStyle = "#4aa3df";
    gridCtx.lineWidth = 2;

    for(let i=0;i<=cols;i++){

        gridCtx.beginPath();
        gridCtx.moveTo(i*w,0);
        gridCtx.lineTo(i*w,height);
        gridCtx.stroke();
    }

    for(let j=0;j<=rows;j++){

        gridCtx.beginPath();
        gridCtx.moveTo(0,j*h);
        gridCtx.lineTo(width,j*h);
        gridCtx.stroke();
    }

    gridCtx.strokeStyle = "#cfe8f7";
    gridCtx.lineWidth = 1;

    for(let i=0;i<cols;i++){

        for(let j=0;j<rows;j++){

            gridCtx.beginPath();
            gridCtx.moveTo(i*w + w/2, j*h);
            gridCtx.lineTo(i*w + w/2, j*h + h);
            gridCtx.stroke();

            gridCtx.beginPath();
            gridCtx.moveTo(i*w, j*h + h/2);
            gridCtx.lineTo(i*w + w, j*h + h/2);
            gridCtx.stroke();
        }
    }

    gridCtx.fillStyle = "rgba(0,0,0,0.08)";
    gridCtx.font = `${w*0.7}px sans-serif`;

    for(let i=0;i<4;i++){

        gridCtx.fillText(
            currentKanji,
            i*w+w*0.15,
            h*0.75
        );
    }
}

function getPos(e){

    const rect = drawCanvas.getBoundingClientRect();

    let clientX;
    let clientY;

    if(e.touches){

        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;

    }else{

        clientX = e.clientX;
        clientY = e.clientY;
    }

    return{
        x:clientX - rect.left,
        y:clientY - rect.top
    };
}

function startDraw(e){

    drawing = true;

    const pos = getPos(e);

    drawCtx.beginPath();
    drawCtx.moveTo(pos.x,pos.y);
}

function draw(e){

    if(!drawing) return;

    e.preventDefault();

    const pos = getPos(e);

    if(eraserMode){

        drawCtx.globalCompositeOperation = "destination-out";
        drawCtx.lineWidth = 30;

    }else{

        drawCtx.globalCompositeOperation = "source-over";

        if(teacherMode){

            drawCtx.strokeStyle = "red";

        }else{

            drawCtx.strokeStyle = "black";
        }

        drawCtx.lineWidth = 6;
    }

    drawCtx.lineCap = "round";
    drawCtx.lineJoin = "round";

    drawCtx.lineTo(pos.x,pos.y);
    drawCtx.stroke();
}

function endDraw(){

    drawing = false;
}

drawCanvas.addEventListener("mousedown",startDraw);
drawCanvas.addEventListener("mousemove",draw);
drawCanvas.addEventListener("mouseup",endDraw);
drawCanvas.addEventListener("mouseleave",endDraw);

drawCanvas.addEventListener("touchstart",startDraw,{passive:false});
drawCanvas.addEventListener("touchmove",draw,{passive:false});
drawCanvas.addEventListener("touchend",endDraw);

document.getElementById("penBtn").onclick = ()=>{

    eraserMode = false;
    teacherMode = false;
};

document.getElementById("eraserBtn").onclick = ()=>{

    eraserMode = true;
};

document.getElementById("doneBtn").onclick = ()=>{

    teacherMode = true;
    eraserMode = false;

    document.getElementById("message").innerText =
    "先生の赤ペンモード";
};

document.getElementById("clearBtn").onclick = ()=>{

    drawCtx.clearRect(
        0,
        0,
        drawCanvas.width,
        drawCanvas.height
    );

    savedDrawings[currentKanji] = null;
};

window.addEventListener("resize",resizeCanvas);

resizeCanvas();

</script>

</body>
</html>
