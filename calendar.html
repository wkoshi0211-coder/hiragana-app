<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>きょう・きのう・あした カレンダー課題</title>
<style>
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
                 "Yu Gothic", "Meiryo", sans-serif;
    background: #f5f7fb;
    color: #222;
  }

  body {
    padding: 8px;
    overscroll-behavior: none;
    touch-action: manipulation;
  }

  .app {
    width: min(1100px, 100%);
    height: calc(100vh - 16px);
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .calendar-card {
    background: #fff;
    border-radius: 14px;
    padding: 8px;
    box-shadow: 0 3px 14px rgba(0,0,0,.08);
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }

  .month-title {
    flex: 0 0 auto;
    text-align: center;
    font-size: clamp(22px, 4vw, 34px);
    font-weight: 700;
    line-height: 1.15;
    margin: 1px 0 5px;
  }

  .weekdays {
    flex: 0 0 auto;
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 3px;
  }

  .weekday {
    text-align: center;
    font-size: clamp(14px, 2.2vw, 22px);
    font-weight: 700;
    line-height: 1.1;
    padding: 2px 0 3px;
  }

  .weekday.sun { color: #d33; }
  .weekday.sat { color: #1769aa; }

  .calendar-grid {
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    grid-auto-rows: minmax(0, 1fr);
    gap: 3px;
  }

  .day-cell {
    position: relative;
    min-width: 0;
    min-height: 0;
    border: 2px solid #cfd5df;
    border-radius: 8px;
    background: #fff;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    cursor: pointer;
  }

  .day-cell.empty {
    background: #eef1f5;
    border-color: #e1e5eb;
    cursor: default;
  }

  .day-cell.today {
    border: 4px solid #e46a2a;
    background: #fffaf5;
  }

  .day-number {
    position: absolute;
    top: 3px;
    left: 5px;
    z-index: 3;
    font-size: clamp(16px, 2.7vw, 27px);
    font-weight: 700;
    line-height: 1;
  }

  .day-cell.sunday .day-number { color: #d33; }
  .day-cell.saturday .day-number { color: #1769aa; }

  .event-image {
    position: absolute;
    left: 50%;
    top: 56%;
    transform: translate(-50%, -50%);
    max-width: 76%;
    max-height: 68%;
    object-fit: contain;
    pointer-events: none;
    user-select: none;
    -webkit-user-drag: none;
    z-index: 1;
  }

  .selected {
    outline: 4px solid #6b7cff;
    outline-offset: -4px;
  }

  .day-cell.drop-hover {
    background: #eef4ff;
    border-color: #4967d8;
  }

  /* カレンダー内に置かれたタグ */
  .placed-tag {
    position: absolute;
    left: 50%;
    top: 55%;
    transform: translate(-50%, -50%);
    width: min(88%, 110px);
    height: min(46%, 52px);
    min-height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2px 4px;
    border: 2px solid #333;
    border-radius: 8px;
    background: #fff;
    color: #222;
    font-size: clamp(13px, 2.1vw, 22px);
    font-weight: 700;
    line-height: 1;
    white-space: nowrap;
    z-index: 4;
    pointer-events: none;
    overflow: hidden;
  }

  .upload-panel {
    display: none;
    flex: 0 0 auto;
    margin-top: 6px;
    padding: 6px;
    background: #eef2ff;
    border-radius: 10px;
    text-align: center;
  }

  .upload-panel.show { display: block; }

  .selected-date {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 5px;
  }

  .button-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 5px;
  }

  button, .file-label {
    border: 0;
    border-radius: 9px;
    padding: 7px 12px;
    font-size: 15px;
    font-weight: 700;
    background: #4967d8;
    color: #fff;
    cursor: pointer;
    min-height: 38px;
  }

  button.secondary { background: #777; }
  button.danger { background: #c74b4b; }

  input[type=file] { display: none; }

  .tags-area {
    flex: 0 0 auto;
    margin-top: 7px;
    background: #fff;
    border-radius: 14px;
    padding: 6px 8px;
    box-shadow: 0 3px 14px rgba(0,0,0,.08);
  }

  .tags {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 9px;
  }

  .tag {
    width: min(28vw, 150px);
    min-height: 52px;
    padding: 7px 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 3px solid #333;
    border-radius: 12px;
    background: #fff;
    font-size: clamp(20px, 3.2vw, 30px);
    font-weight: 700;
    line-height: 1;
    box-shadow: 0 2px 7px rgba(0,0,0,.12);
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    cursor: grab;
  }

  .tag.done {
    visibility: hidden;
  }

  .tag.dragging {
    position: fixed;
    z-index: 1000;
    pointer-events: none;
    transform: scale(1.04);
    box-shadow: 0 9px 20px rgba(0,0,0,.22);
    cursor: grabbing;
  }

  .message {
    min-height: 25px;
    text-align: center;
    font-size: 17px;
    font-weight: 700;
    line-height: 1.2;
    margin-top: 3px;
  }

  .reset-wrap {
    text-align: center;
    margin-top: 2px;
  }

  .reset-wrap button {
    min-height: 32px;
    padding: 4px 12px;
    font-size: 14px;
  }

  /* iPad横向きなど、画面の高さが限られる場合 */
  @media (orientation: landscape) and (max-height: 900px) {
    body { padding: 5px; }

    .app {
      height: calc(100vh - 10px);
    }

    .calendar-card {
      padding: 5px;
      border-radius: 10px;
    }

    .month-title {
      font-size: clamp(20px, 3.8vw, 30px);
      margin: 0 0 2px;
    }

    .weekday {
      font-size: clamp(13px, 2vw, 19px);
      padding: 1px 0 2px;
    }

    .weekdays, .calendar-grid {
      gap: 2px;
    }

    .day-cell {
      border-width: 1px;
      border-radius: 5px;
    }

    .day-cell.today {
      border-width: 3px;
    }

    .day-number {
      top: 2px;
      left: 3px;
      font-size: clamp(14px, 2.3vw, 23px);
    }

    .placed-tag {
      width: 86%;
      height: 45%;
      min-height: 24px;
      border-width: 2px;
      border-radius: 6px;
      font-size: clamp(12px, 1.8vw, 20px);
    }

    .tags-area {
      margin-top: 4px;
      padding: 4px 6px;
      border-radius: 10px;
    }

    .tag {
      min-height: 43px;
      width: min(23vw, 140px);
      padding: 5px 9px;
      border-width: 2px;
      border-radius: 9px;
      font-size: clamp(18px, 2.8vw, 26px);
    }

    .message {
      min-height: 19px;
      font-size: 15px;
      margin-top: 1px;
    }

    .reset-wrap {
      display: none;
    }

    .upload-panel {
      position: absolute;
      left: 8px;
      right: 8px;
      bottom: 57px;
      z-index: 20;
      box-shadow: 0 4px 16px rgba(0,0,0,.18);
    }
  }

  @media (orientation: landscape) and (max-height: 700px) {
    .month-title { font-size: 22px; }
    .weekday { font-size: 13px; }
    .tag {
      min-height: 36px;
      font-size: 18px;
      padding: 3px 7px;
    }
    .message { font-size: 13px; min-height: 16px; }
  }
</style>
</head>
<body>
<div class="app">
  <section class="calendar-card">
    <div class="month-title" id="monthTitle"></div>

    <div class="weekdays">
      <div class="weekday sun">日</div>
      <div class="weekday">月</div>
      <div class="weekday">火</div>
      <div class="weekday">水</div>
      <div class="weekday">木</div>
      <div class="weekday">金</div>
      <div class="weekday sat">土</div>
    </div>

    <div class="calendar-grid" id="calendarGrid"></div>

    <div class="upload-panel" id="uploadPanel">
      <div class="selected-date" id="selectedDate"></div>
      <div class="button-row">
        <label class="file-label" for="imageInput">イラストをアップロード</label>
        <button class="danger" id="deleteImageBtn" type="button">この日の画像を削除</button>
        <button class="secondary" id="closePanelBtn" type="button">閉じる</button>
      </div>
      <input id="imageInput" type="file" accept="image/*">
    </div>
  </section>

  <section class="tags-area">
    <div class="tags">
      <div class="tag" data-type="yesterday">きのう</div>
      <div class="tag" data-type="today">きょう</div>
      <div class="tag" data-type="tomorrow">あした</div>
    </div>
    <div class="message" id="message"></div>
    <div class="reset-wrap">
      <button class="secondary" id="resetBtn" type="button">やりなおす</button>
    </div>
  </section>
</div>

<script>
(() => {
  "use strict";

  const STORAGE_KEY = "calendarLearningImages_v2";

  const monthTitle = document.getElementById("monthTitle");
  const calendarGrid = document.getElementById("calendarGrid");
  const uploadPanel = document.getElementById("uploadPanel");
  const selectedDateEl = document.getElementById("selectedDate");
  const imageInput = document.getElementById("imageInput");
  const deleteImageBtn = document.getElementById("deleteImageBtn");
  const closePanelBtn = document.getElementById("closePanelBtn");
  const resetBtn = document.getElementById("resetBtn");
  const message = document.getElementById("message");

  const now = new Date();
  const currentYear = now.getFullYear();
  const currentMonth = now.getMonth();
  const todayKey = dateKey(now);

  let selectedKey = null;

  const answers = {
    yesterday: false,
    today: false,
    tomorrow: false
  };

  let placedTags = {};
  let imageStore = loadImages();

  function dateKey(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, "0");
    const d = String(date.getDate()).padStart(2, "0");
    return `${y}-${m}-${d}`;
  }

  function dateFromKey(key) {
    const [y, m, d] = key.split("-").map(Number);
    return new Date(y, m - 1, d);
  }

  function loadImages() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : {};
    } catch (e) {
      return {};
    }
  }

  function saveImages() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(imageStore));
    } catch (e) {
      alert("画像を保存できませんでした。画像の容量が大きすぎる可能性があります。");
    }
  }

  function getRelativeKey(offset) {
    const d = new Date(now);
    d.setDate(d.getDate() + offset);
    return dateKey(d);
  }

  function formatJapaneseDate(key) {
    const d = dateFromKey(key);
    return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`;
  }

  function renderCalendar() {
    monthTitle.textContent = `${currentYear}年${currentMonth + 1}月`;
    calendarGrid.innerHTML = "";

    const firstDay = new Date(currentYear, currentMonth, 1).getDay();
    const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();

    for (let i = 0; i < firstDay; i++) {
      const empty = document.createElement("div");
      empty.className = "day-cell empty";
      calendarGrid.appendChild(empty);
    }

    for (let day = 1; day <= daysInMonth; day++) {
      const d = new Date(currentYear, currentMonth, day);
      const key = dateKey(d);

      const cell = document.createElement("div");
      cell.className = "day-cell";
      cell.dataset.date = key;

      if (d.getDay() === 0) cell.classList.add("sunday");
      if (d.getDay() === 6) cell.classList.add("saturday");
      if (key === todayKey) cell.classList.add("today");

      const number = document.createElement("div");
      number.className = "day-number";
      number.textContent = day;
      cell.appendChild(number);

      if (imageStore[key]) {
        const img = document.createElement("img");
        img.className = "event-image";
        img.src = imageStore[key];
        img.alt = "";
        cell.appendChild(img);
      }

      if (placedTags[key]) {
        appendPlacedTag(cell, placedTags[key]);
      }

      cell.addEventListener("pointerup", () => {
        if (!draggingTag) selectDate(key, cell);
      });

      calendarGrid.appendChild(cell);
    }
  }

  function appendPlacedTag(cell, type) {
    const tag = document.createElement("div");
    tag.className = "placed-tag";
    tag.textContent = type === "yesterday" ? "きのう"
                    : type === "today" ? "きょう"
                    : "あした";
    cell.appendChild(tag);
  }

  function selectDate(key, cell) {
    document.querySelectorAll(".day-cell.selected").forEach(el => el.classList.remove("selected"));
    cell.classList.add("selected");
    selectedKey = key;
    selectedDateEl.textContent = `${formatJapaneseDate(key)} にイラストを登録`;
    uploadPanel.classList.add("show");
  }

  function closePanel() {
    uploadPanel.classList.remove("show");
    selectedKey = null;
    document.querySelectorAll(".day-cell.selected").forEach(el => el.classList.remove("selected"));
  }

  imageInput.addEventListener("change", () => {
    const file = imageInput.files && imageInput.files[0];
    if (!file || !selectedKey) return;

    if (!file.type.startsWith("image/")) {
      alert("画像ファイルを選択してください。");
      imageInput.value = "";
      return;
    }

    const reader = new FileReader();
    reader.onload = () => {
      imageStore[selectedKey] = reader.result;
      saveImages();
      const key = selectedKey;
      renderCalendar();
      const cell = document.querySelector(`.day-cell[data-date="${key}"]`);
      if (cell) cell.classList.add("selected");
      imageInput.value = "";
    };
    reader.readAsDataURL(file);
  });

  deleteImageBtn.addEventListener("click", () => {
    if (!selectedKey) return;
    if (imageStore[selectedKey]) {
      delete imageStore[selectedKey];
      saveImages();
      const key = selectedKey;
      renderCalendar();
      const cell = document.querySelector(`.day-cell[data-date="${key}"]`);
      if (cell) cell.classList.add("selected");
    }
  });

  closePanelBtn.addEventListener("click", closePanel);

  function updateMessage() {
    const count = Object.values(answers).filter(Boolean).length;
    if (count === 3) {
      message.textContent = "ぜんぶ せいかい！";
    } else if (count > 0) {
      message.textContent = `${count}こ せいかい！`;
    } else {
      message.textContent = "";
    }
  }

  function resetTags() {
    answers.yesterday = false;
    answers.today = false;
    answers.tomorrow = false;
    placedTags = {};
    document.querySelectorAll(".tag").forEach(tag => tag.classList.remove("done"));
    message.textContent = "";
    renderCalendar();
  }

  resetBtn.addEventListener("click", resetTags);

  let draggingTag = null;
  let dragClone = null;
  let dragType = null;
  let startOffsetX = 0;
  let startOffsetY = 0;

  document.querySelectorAll(".tag").forEach(tag => {
    tag.addEventListener("pointerdown", (e) => {
      if (answers[tag.dataset.type]) return;

      e.preventDefault();
      draggingTag = tag;
      dragType = tag.dataset.type;

      const rect = tag.getBoundingClientRect();

      dragClone = tag.cloneNode(true);
      dragClone.classList.add("dragging");
      dragClone.style.width = rect.width + "px";
      dragClone.style.height = rect.height + "px";
      document.body.appendChild(dragClone);

      startOffsetX = e.clientX - rect.left;
      startOffsetY = e.clientY - rect.top;

      moveClone(e.clientX, e.clientY);
      tag.setPointerCapture?.(e.pointerId);
    });

    tag.addEventListener("pointermove", (e) => {
      if (!draggingTag) return;
      e.preventDefault();
      moveClone(e.clientX, e.clientY);
      highlightDropTarget(e.clientX, e.clientY);
    });

    tag.addEventListener("pointerup", (e) => {
      if (!draggingTag) return;
      e.preventDefault();
      const target = findDropTarget(e.clientX, e.clientY);
      finishDrag(target);
    });

    tag.addEventListener("pointercancel", () => {
      if (draggingTag) finishDrag(null);
    });
  });

  function moveClone(x, y) {
    if (!dragClone) return;
    dragClone.style.left = (x - startOffsetX) + "px";
    dragClone.style.top = (y - startOffsetY) + "px";
  }

  function findDropTarget(x, y) {
    const cells = document.querySelectorAll(".day-cell:not(.empty)");
    for (const cell of cells) {
      const r = cell.getBoundingClientRect();
      if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) {
        return cell;
      }
    }
    return null;
  }

  function highlightDropTarget(x, y) {
    document.querySelectorAll(".day-cell.drop-hover").forEach(el => el.classList.remove("drop-hover"));
    const target = findDropTarget(x, y);
    if (target) target.classList.add("drop-hover");
  }

  function finishDrag(target) {
    document.querySelectorAll(".day-cell.drop-hover").forEach(el => el.classList.remove("drop-hover"));

    if (target) {
      const expected = {
        yesterday: getRelativeKey(-1),
        today: getRelativeKey(0),
        tomorrow: getRelativeKey(1)
      }[dragType];

      if (target.dataset.date === expected) {
        answers[dragType] = true;
        placedTags[expected] = dragType;
        draggingTag.classList.add("done");

        /* 正解したタグを実際にその日付の枠内へ置く */
        appendPlacedTag(target, dragType);
        updateMessage();
      } else {
        message.textContent = "もういちど よく見てみましょう。";
        setTimeout(() => {
          if (Object.values(answers).filter(Boolean).length < 3) {
            message.textContent = "";
          }
        }, 1300);
      }
    }

    if (dragClone) dragClone.remove();
    dragClone = null;
    draggingTag = null;
    dragType = null;
  }

  renderCalendar();
})();
</script>
</body>
</html>
