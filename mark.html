<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>マークと生活場面</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;background:#fff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;overflow:hidden;touch-action:none}
body{display:flex;align-items:center;justify-content:center}
#app{width:min(100vw,1024px);height:min(100vh,768px);padding:18px 24px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:12px}
#progress{height:10px;width:min(82vw,760px);display:flex;gap:5px;justify-content:center;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:#ddd}
.dot.done{background:#333}
.dot.current{width:11px;height:11px;background:#111}
#signArea{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
#sign{max-width:min(34vw,230px);max-height:31vh;width:auto;height:auto;object-fit:contain;user-select:none;-webkit-user-drag:none}
#answer{width:min(42vw,300px);height:min(18vh,140px);min-height:105px;border:5px dashed #aaa;border-radius:24px;display:flex;align-items:center;justify-content:center;transition:.12s ease;background:#fff}
#answer.active{border-color:#111;transform:scale(1.03)}
#answer img{max-width:88%;max-height:88%;object-fit:contain;user-select:none;pointer-events:none}
#choices{width:100%;display:flex;justify-content:center;align-items:center;gap:clamp(14px,5vw,60px);min-height:170px}
.choice{width:min(25vw,190px);height:min(21vh,155px);display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none;cursor:grab}
.choice img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;pointer-events:none;user-select:none;-webkit-user-drag:none}
.choice.dragging{position:fixed;z-index:1000;pointer-events:none;transform:scale(1.08);opacity:.9;cursor:grabbing}
#feedback{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .12s}
#feedback .mark{font-size:clamp(90px,20vw,170px);font-weight:800;color:#e60000}
#feedback.ok{opacity:1}
#feedback.bad{opacity:0}
#finish{position:fixed;inset:0;background:#fff;display:none;align-items:center;justify-content:center;flex-direction:column;gap:18px}
#finish.show{display:flex}
#finish .star{font-size:clamp(100px,24vw,190px)}
#restart{font-size:22px;border:3px solid #222;border-radius:18px;background:#fff;padding:12px 28px;touch-action:manipulation}
@media (orientation:portrait){
 #app{height:100vh;padding:16px 14px}
 #sign{max-width:48vw;max-height:27vh}
 #answer{width:min(55vw,300px);height:130px}
 #choices{gap:8px;min-height:190px}
 .choice{width:31vw;height:170px}
}
</style>
</head>
<body>
<main id="app" aria-label="マークと生活場面の学習">
  <div id="progress"></div>
  <div id="signArea"><img id="sign" alt="表示"></div>
  <div id="answer" aria-label="解答欄"></div>
  <div id="choices" aria-label="3つのイラスト"></div>
</main>
<div id="feedback"><div class="mark">○</div></div>
<div id="finish">
  <div class="star">★</div>
  <button id="restart" type="button">もういちど</button>
</div>

const questions=[{"page":1,"scene":1,"sign":6,"choices":[2,1,4]},{"page":1,"scene":2,"sign":4,"choices":[5,3,2]},{"page":1,"scene":3,"sign":1,"choices":[3,4,1]},{"page":1,"scene":4,"sign":2,"choices":[5,2,4]},{"page":2,"scene":2,"sign":1,"choices":[2,5,3]},{"page":2,"scene":4,"sign":3,"choices":[2,4,5]},{"page":3,"scene":4,"sign":4,"choices":[5,2,4]},{"page":3,"scene":5,"sign":2,"choices":[3,1,5]},{"page":4,"scene":1,"sign":5,"choices":[4,1,2]},{"page":4,"scene":2,"sign":4,"choices":[5,2,3]},{"page":4,"scene":4,"sign":2,"choices":[2,5,4]},{"page":5,"scene":1,"sign":4,"choices":[1,2,4]},{"page":5,"scene":2,"sign":5,"choices":[2,3,5]},{"page":5,"scene":5,"sign":3,"choices":[3,1,5]},{"page":6,"scene":1,"sign":4,"choices":[2,4,1]},{"page":6,"scene":2,"sign":6,"choices":[5,2,3]},{"page":6,"scene":3,"sign":5,"choices":[1,4,3]},{"page":6,"scene":4,"sign":1,"choices":[5,2,4]},{"page":6,"scene":5,"sign":3,"choices":[3,1,5]}];
let index=0;
const progress=document.getElementById('progress');
const signEl=document.getElementById('sign');
const answer=document.getElementById('answer');
const choices=document.getElementById('choices');
const feedback=document.getElementById('feedback');
const finish=document.getElementById('finish');
const restart=document.getElementById('restart');
let drag={el:null, clone:null, pointerId:null, startX:0, startY:0, correct:false};

function buildProgress(){
 progress.innerHTML='';
 for(let i=0;i<questions.length;i++){
   const d=document.createElement('div'); d.className='dot';
   if(i<index)d.classList.add('done');
   if(i===index)d.classList.add('current');
   progress.appendChild(d);
 }
}
function renderQuestion(){
 if(index>=questions.length){finish.classList.add('show'); return;}
 finish.classList.remove('show');
 buildProgress();
 const q=questions[index];
 signEl.src=signImages[`${q.page}_${q.sign}`];
 answer.innerHTML=''; answer.classList.remove('active');
 choices.innerHTML='';
 q.choices.forEach((sceneNo)=>{
   const b=document.createElement('div'); b.className='choice'; b.dataset.scene=sceneNo;
   const img=document.createElement('img'); img.src=sceneImages[`${q.page}_${sceneNo}`]; img.alt='';
   b.appendChild(img); choices.appendChild(b); attachDrag(b, sceneNo===q.scene);
 });
}
function point(e){return {x:e.clientX,y:e.clientY}}
function attachDrag(el,isCorrect){
 el.addEventListener('pointerdown',e=>{
   if(e.pointerType==='mouse' && e.button!==0) return;
   e.preventDefault();
   drag.el=el; drag.pointerId=e.pointerId; drag.correct=isCorrect;
   const r=el.getBoundingClientRect();
   drag.startX=e.clientX-r.left; drag.startY=e.clientY-r.top;
   el.classList.add('dragging');
   el.style.left=(e.clientX-drag.startX)+'px'; el.style.top=(e.clientY-drag.startY)+'px';
   el.style.width=r.width+'px'; el.style.height=r.height+'px';
   document.body.appendChild(el);
   try{el.setPointerCapture(e.pointerId)}catch(_){}
 });
 el.addEventListener('pointermove',e=>{
   if(drag.el!==el || drag.pointerId!==e.pointerId) return;
   e.preventDefault();
   el.style.left=(e.clientX-drag.startX)+'px'; el.style.top=(e.clientY-drag.startY)+'px';
   const ar=answer.getBoundingClientRect();
   const inside=e.clientX>=ar.left && e.clientX<=ar.right && e.clientY>=ar.top && e.clientY<=ar.bottom;
   answer.classList.toggle('active',inside);
 });
 el.addEventListener('pointerup',e=>{
   if(drag.el!==el || drag.pointerId!==e.pointerId) return;
   const ar=answer.getBoundingClientRect();
   const inside=e.clientX>=ar.left && e.clientX<=ar.right && e.clientY>=ar.top && e.clientY<=ar.bottom;
   finishDrag(inside && drag.correct);
 });
 el.addEventListener('pointercancel',()=>finishDrag(false));
}
function finishDrag(correct){
 const el=drag.el;
 if(!el) return;
 answer.classList.remove('active');
 if(correct){
   el.classList.remove('dragging');
   el.style.position='static'; el.style.left=''; el.style.top=''; el.style.width=''; el.style.height='';
   answer.appendChild(el);
   feedback.classList.add('ok');
   setTimeout(()=>{feedback.classList.remove('ok'); index++; renderQuestion();},650);
 }else{
   el.classList.remove('dragging');
   el.style.position=''; el.style.left=''; el.style.top=''; el.style.width=''; el.style.height='';
   choices.appendChild(el);
 }
 drag={el:null,clone:null,pointerId:null,startX:0,startY:0,correct:false};
}
restart.addEventListener('click',()=>{index=0;renderQuestion();});
renderQuestion();
</script>
